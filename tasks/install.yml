---

- name: Install LXDE on RedHat family
  when: ansible_facts.os_family == 'RedHat'
  block:

    - name: Install EPEL (RedHat family)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      register: packages_result
      retries: 3
      delay: 10
      until: not packages_result.failed

    - name: Install LXDE (RedHat family)
      ansible.builtin.dnf:
        name: '@lxde-desktop'
        state: present
      register: packages_result
      retries: 3
      delay: 10
      until: not packages_result.failed

- name: Install LXDE on Debian family
  when: ansible_facts.os_family == 'Debian'
  block:

    - name: Install LXDE (Debian family)
      ansible.builtin.apt:
        name: lxde
        state: present
        force_apt_get: yes
      register: packages_result
      retries: 3
      delay: 10
      until: not packages_result.failed

    - name: Install LightDM display manager
      ansible.builtin.apt:
        name: lightdm
        state: present
      notify: Restart LightDM
      register: packages_result
      retries: 3
      delay: 10
      until: not packages_result.failed
